<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dan Dare - Pilot of the Future</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="512" height="384"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <h1 class="spectrum-title">DAN DARE</h1>
            <h2 class="spectrum-subtitle">PILOT OF THE FUTURE</h2>
            <p class="instructions">ARROWS / WASD - Move<br>SPACE - Fire<br>P - Pause</p>
            <button id="start-btn" class="spectrum-btn">START GAME</button>
        </div>
        
        <!-- Pause Screen -->
        <div id="pause-screen" class="overlay hidden">
            <h2 class="spectrum-title">PAUSED</h2>
            <button id="resume-btn" class="spectrum-btn">RESUME</button>
        </div>
        
        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <h2 class="spectrum-title">GAME OVER</h2>
            <p id="final-score">Score: 0</p>
            <button id="restart-btn" class="spectrum-btn">PLAY AGAIN</button>
        </div>
        
        <!-- HUD -->
        <div id="hud" class="hidden">
            <div id="score-display">SCORE: <span id="score">0</span></div>
            <div id="fuel-display">FUEL: <span id="fuel">100</span>%</div>
            <div id="lives-display">LIVES: <span id="lives">3</span></div>
        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
