  <div id="wrap">
    <canvas id="screen" width="768" height="576"></canvas>
    <p id="help">
      <b>O</b>/<b>P</b> or <b>&larr;</b><b>&rarr;</b> move &nbsp;
      <b>Q</b>/<b>&uarr;</b> jump &amp; ride grav-lifts &nbsp;
      <b>A</b>/<b>&darr;</b> kneel &nbsp;
      <b>Space</b> fire &nbsp; <b>Backspace</b> back 5 s &nbsp; <b>Enter</b> start
      <br>
      Or the mouse: hold the <b>right button</b> near a wall, the ceiling or the floor to move,
      <b>left button</b> to fire, and on the menus click the line you want.
    </p>
