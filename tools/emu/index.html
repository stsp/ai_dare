<!doctype html><meta charset="utf-8"><title>emu</title>
<body style="margin:0;background:#000">
<div id="jsspeccy"></div>
<script src="jsspeccy/jsspeccy.js"></script>
<script>
  window.__ready=false; window.emu = JSSpeccy(document.getElementById('jsspeccy'), { zoom: 1, machine: 48, openUrl: 'dandare.z80', keyboardEnabled: true, autoStart: true });
  if (window.emu.onReady) window.emu.onReady(()=>{ window.__ready=true; });
</script>
</body>
